services:
  graph-node:
    image: graphprotocol/graph-node:latest
    # graph-node publishes amd64 images only; on Apple Silicon this runs under emulation
    platform: linux/amd64
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # Set BASE_SEPOLIA_RPC_URL in .env (archive RPC; never commit the key)
      ethereum: "base-sepolia:${BASE_SEPOLIA_RPC_URL:?set BASE_SEPOLIA_RPC_URL in .env}"
      GRAPH_LOG: debug
  ipfs:
    # ipfs/go-ipfs is deprecated: its latest tag only prints "use ipfs/kubo" and exits
    image: ipfs/kubo:v0.38.1
    ports:
      - "5001:5001"
    volumes:
      - ./data/ipfs:/data/ipfs
  postgres:
    # Pinned: postgres 18+ moved PGDATA/VOLUME to /var/lib/postgresql, which breaks the mount below
    image: postgres:16
    ports:
      - "5432:5432"
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements"
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
