type Transaction @entity(immutable: true) {
  # txn hash
  id: ID!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt!
  gasPrice: BigInt!
  # derived values
  pointClaims: [PointClaim]! @derivedFrom(field: "transaction")
  pointBurns: [PointBurn]! @derivedFrom(field: "transaction")
}

# Individual point claim record
type PointClaim @entity(immutable: true) {
  # Format: {txHash}-{logIndex}
  id: ID!
  # Recipient address
  to: Bytes!
  # Amount of points claimed
  amount: BigInt!
  # Nonce used for the claim
  nonce: BigInt!
  # Block timestamp
  timestamp: BigInt!
  # Reference to transaction
  transaction: Transaction!
}

# Individual point burn record
type PointBurn @entity(immutable: true) {
  # Format: {txHash}-{logIndex}
  id: ID!
  # Burner address (who burned the tokens)
  from: Bytes!
  # Amount of points burned
  amount: BigInt!
  # Block timestamp
  timestamp: BigInt!
  # Reference to transaction
  transaction: Transaction!
}
