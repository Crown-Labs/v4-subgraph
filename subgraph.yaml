specVersion: 0.0.4
description: Subgraph for Kittycorn point claims and burns
repository: https://github.com/Crown-Labs/v4-subgraph
schema:
  file: ./schema.graphql
features:
  - nonFatalErrors
dataSources:
  - kind: ethereum/contract
    name: KittycornPointDistributor
    network: sepolia
    source:
      abi: KittycornPointDistributor
      address: "0x8a04972c8ac160f83705959951623A51d081BcB7"
      startBlock: 10430600
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - PointClaim
        - Transaction
      abis:
        - name: KittycornPointDistributor
          file: ./abis/KittycornPointDistributor.json
      eventHandlers:
        - event: Claimed(indexed address,uint256,uint256)
          handler: handleClaimed
  - kind: ethereum/contract
    name: PointToken
    network: sepolia
    source:
      abi: PointToken
      address: "0x08AB58e88931931E17F7DB3AE70c1d13b5F031ed"
      startBlock: 10430600
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - PointBurn
        - Transaction
      abis:
        - name: PointToken
          file: ./abis/PointToken.json
      eventHandlers:
        - event: Burn(indexed address,uint256)
          handler: handleBurn
