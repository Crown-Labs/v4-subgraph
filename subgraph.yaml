specVersion: 0.0.4
description: Subgraph for Kittycorn point claims and burns
repository: https://github.com/Crown-Labs/v4-subgraph
schema:
  file: ./schema.graphql
features:
  - nonFatalErrors
dataSources:
  - kind: ethereum/contract
    name: KittycornPointDistributor
    network: sepolia
    source:
      abi: KittycornPointDistributor
      address: "0x0d9137F6816020d5aD7E9ac67e824F06a7cEC4bb"
      startBlock: 10269300
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - PointClaim
        - Transaction
      abis:
        - name: KittycornPointDistributor
          file: ./abis/KittycornPointDistributor.json
      eventHandlers:
        - event: Claimed(indexed address,uint256,uint256)
          handler: handleClaimed
